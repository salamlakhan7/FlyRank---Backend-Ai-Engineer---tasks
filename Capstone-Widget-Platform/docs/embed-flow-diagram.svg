<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="1000" height="460" fill="#FAFAF8"/>

  <!-- Owner -->
  <rect x="30" y="30" width="160" height="60" rx="6" fill="#0B1220"/>
  <text x="110" y="55" fill="#EDEFF3" font-size="13" text-anchor="middle" font-weight="600">Owner</text>
  <text x="110" y="74" fill="#E8A33D" font-size="10.5" text-anchor="middle">(authenticated)</text>

  <!-- Widgets service -->
  <rect x="280" y="30" width="200" height="60" rx="6" fill="#0B1220"/>
  <text x="380" y="55" fill="#EDEFF3" font-size="13" text-anchor="middle" font-weight="600">Widgets service</text>
  <text x="380" y="74" fill="#E8A33D" font-size="10.5" text-anchor="middle">tenant-isolated CRUD</text>

  <!-- arrow owner -> widgets -->
  <line x1="190" y1="60" x2="278" y2="60" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="234" y="50" fill="#6B7280" font-size="10" text-anchor="middle">POST /widgets</text>

  <!-- Embed snippet returned -->
  <rect x="560" y="30" width="200" height="60" rx="6" fill="#FFF7E9" stroke="#E8A33D"/>
  <text x="660" y="55" fill="#14181F" font-size="13" text-anchor="middle" font-weight="600">Embed snippet</text>
  <text x="660" y="74" fill="#9C6A1E" font-size="10" text-anchor="middle">&lt;script data-widget-id&gt;</text>
  <line x1="480" y1="60" x2="558" y2="60" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Customer site -->
  <rect x="30" y="160" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#D9DCE3"/>
  <text x="140" y="188" fill="#14181F" font-size="13" text-anchor="middle" font-weight="600">Customer site</text>
  <text x="140" y="206" fill="#6B7280" font-size="10" text-anchor="middle">(a different origin)</text>
  <text x="140" y="221" fill="#6B7280" font-size="9.5" text-anchor="middle">&lt;script src=cdn/widget.js&gt;</text>

  <!-- Config endpoint -->
  <rect x="330" y="160" width="220" height="70" rx="6" fill="#0B1220"/>
  <text x="440" y="188" fill="#EDEFF3" font-size="13" text-anchor="middle" font-weight="600">GET /widgets/:id/config</text>
  <text x="440" y="206" fill="#E8A33D" font-size="10" text-anchor="middle">public · cached · CORS</text>
  <text x="440" y="221" fill="#8B93A7" font-size="9.5" text-anchor="middle">Cache-Control + ETag</text>

  <line x1="250" y1="195" x2="328" y2="195" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="289" y="185" fill="#6B7280" font-size="9.5" text-anchor="middle">fetch config</text>

  <!-- dashed line widgets -> config (same service) -->
  <line x1="380" y1="90" x2="380" y2="160" stroke="#D9DCE3" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Widget renders -->
  <rect x="30" y="270" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D9DCE3"/>
  <text x="140" y="295" fill="#14181F" font-size="13" text-anchor="middle" font-weight="600">Widget renders</text>
  <text x="140" y="313" fill="#6B7280" font-size="10" text-anchor="middle">visitor sees popover / form</text>
  <line x1="440" y1="230" x2="440" y2="252" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="440" y1="252" x2="140" y2="252" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="140" y1="252" x2="140" y2="268" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Submission endpoint -->
  <rect x="330" y="270" width="220" height="90" rx="6" fill="#0B1220"/>
  <text x="440" y="295" fill="#EDEFF3" font-size="13" text-anchor="middle" font-weight="600">POST /submissions</text>
  <text x="440" y="312" fill="#E8A33D" font-size="10" text-anchor="middle">CORS · validate · rate-limit</text>
  <text x="440" y="327" fill="#E8A33D" font-size="10" text-anchor="middle">spam-check · enrich(geo)</text>
  <text x="440" y="344" fill="#8B93A7" font-size="9.5" text-anchor="middle">→ store, safe side-effect</text>

  <line x1="250" y1="300" x2="328" y2="315" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="289" y="290" fill="#6B7280" font-size="9.5" text-anchor="middle">visitor submits</text>

  <!-- Geo providers -->
  <rect x="620" y="270" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#D9DCE3"/>
  <text x="720" y="292" fill="#14181F" font-size="12" text-anchor="middle" font-weight="600">Geo provider chain</text>
  <text x="720" y="310" fill="#6B7280" font-size="10" text-anchor="middle">provider 1 → 2 → 3</text>
  <text x="720" y="326" fill="#6B7280" font-size="9.5" text-anchor="middle">first success wins</text>
  <text x="720" y="342" fill="#C0483F" font-size="9.5" text-anchor="middle">degrade gracefully if all fail</text>
  <line x1="550" y1="315" x2="618" y2="315" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Storage -->
  <rect x="330" y="390" width="220" height="50" rx="6" fill="#EAF6EF" stroke="#3D8F63"/>
  <text x="440" y="412" fill="#14181F" font-size="12" text-anchor="middle" font-weight="600">submissions table</text>
  <text x="440" y="428" fill="#3D8F63" font-size="9.5" text-anchor="middle">tenant-isolated, enriched</text>
  <line x1="440" y1="360" x2="440" y2="388" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="620" y="390" width="200" height="50" rx="6" fill="#0B1220"/>
  <text x="720" y="412" fill="#EDEFF3" font-size="12" text-anchor="middle" font-weight="600">Owner dashboard</text>
  <text x="720" y="428" fill="#E8A33D" font-size="9.5" text-anchor="middle">authenticated · stats</text>
  <line x1="550" y1="415" x2="618" y2="415" stroke="#6B7280" stroke-width="1.6" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>
</svg>
